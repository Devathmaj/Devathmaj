name: Render profile SVG

on:
  push:
    branches: [main]
    paths:
      - "profile/**"
      - ".github/workflows/render-profile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-profile-svg
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render SVG
        run: node profile/render.mjs

      - name: Commit generated SVG
        run: |
          if git diff --quiet -- assets/profile.svg; then
            echo "assets/profile.svg is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile.svg
          git commit -m "chore: regenerate profile SVG"
          git push origin "HEAD:${{ github.ref_name }}"
